[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsm-process-cockpit"
version = "1.0.0"
description = "IT process analytics, governance reporting, and desktop cockpit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "PySide6>=6.6",
]

[project.scripts]
itsm-pipeline = "main:cli"
itsm-cockpit = "desktop_app.app:main"

[tool.setuptools]
packages = ["desktop_app"]
py-modules = [
    "analytics",
    "data_generator",
    "database",
    "excel_report",
    "ingestion",
    "main",
    "summary_generator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
